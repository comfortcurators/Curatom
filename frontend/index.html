<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curatom Enterprise</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:wght@100..900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // "Night" — Comfort Curators design system (DESIGN.md).
              // Gold (#b9975b) lives only in the logo and the Cream
              // editorial theme; Night's accent is neutral platinum so
              // the UI reads monochrome, like Apple's own dark mode.
              canvas: '#0a0a0c',
              surface: {
                100: '#1c1c1e', // systemGray6 — grouped-card surface
                200: '#2c2c2e', // systemGray5 — raised cell / hover
                300: '#3a3a3c', // systemGray4
                400: '#48484a'  // systemGray3
              },
              ink: {
                primary: '#f5f5f7',                  // Apple off-white
                secondary: 'rgba(245,245,247,.72)',   // ink-soft
                muted: 'rgba(245,245,247,.56)',       // muted
                pewter: '#9a988f',                    // 2nd ink / mark
                'pewter-hi': '#c8c6bd'
              },
              border: {
                DEFAULT: 'rgba(255,255,255,.08)'      // iOS hairline
              },
              accent: {
                DEFAULT: '#c7c7cc',  // platinum — replaces gold in Night
                soft: '#dcdce0',     // platinum soft
                hover: '#a1a1a6',    // platinum hover
                gold: '#b9975b'      // logo/Cream only — never a dark-UI fill
              }
            },
            fontFamily: {
              display: ['Fraunces', 'serif'],
              prose: ['Newsreader', 'serif'],
              ui: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace']
            },
            spacing: {
              '4': '4px',
              '8': '8px',
              '12': '12px',
              '16': '16px',
              '24': '24px',
              '32': '32px',
              '48': '48px',
            },
            borderRadius: {
              'sm': '4px',
              'md': '8px',
              'lg': '12px',
            }
          }
        }
      }
    </script>

    <style>
      body {
        background-color: #0a0a0c;
        color: #f5f5f7;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      /* Card elevation — a little real depth instead of flat grey slabs
         separated only by a 1px hairline. Kept subtle: no glow, no color,
         just enough shadow that surfaces read as raised rather than
         painted-on. */
      .card-elevated {
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
      }

      /* .label-caps — the brand's signature eyebrow: gold letterspaced
         classical caps. In Night it resolves to platinum (per DESIGN.md's
         gold rule); the literal token stays only for the Cream theme. */
      .label-caps {
        text-transform: uppercase;
        letter-spacing: 0.3em;
        color: #c7c7cc;
      }
      html.light .label-caps {
        color: #b9975b;
      }
      
      .app-background {
        position: fixed;
        inset: 0; 
        z-index: 0; 
        pointer-events: none; 
        user-select: none;
        background: radial-gradient(circle at 50% 0%, rgba(245,245,247,0.05), transparent 42%), #0a0a0c;
      }
      
      .app-grain {
        position: fixed; 
        inset: 0; 
        opacity: 0.12; 
        mix-blend-mode: soft-light;
        background-image: linear-gradient(rgba(245,245,247,0.014) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(245,245,247,0.014) 1px, transparent 1px);
        background-size: 4px 4px;
        -webkit-mask-image: radial-gradient(circle at center, black 0%, rgba(0,0,0,.85) 58%, transparent 100%);
        mask-image: radial-gradient(circle at center, black 0%, rgba(0,0,0,.85) 58%, transparent 100%);
        z-index: 0;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .app-grain {
          opacity: 0.05;
        }
      }

      .app-root {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1c1c1e;
      }
      ::-webkit-scrollbar-thumb {
        background: #3a3a3c;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9a988f;
      }
    </style>

      </head>
  <body>
    <div class="app-background"></div>
    <div class="app-grain"></div>
    <div id="root" class="app-root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
