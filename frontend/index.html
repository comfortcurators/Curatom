<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curatom Enterprise</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:wght@100..900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              canvas: '#000000',
              surface: {
                100: '#131210',
                200: '#1c1b16',
                300: '#232017',
                400: '#2c2a22'
              },
              ink: {
                primary: '#c8c6bd',
                secondary: '#9a988f'
              },
              accent: '#b9975b'
            },
            fontFamily: {
              display: ['Fraunces', 'serif'],
              prose: ['Newsreader', 'serif'],
              ui: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace']
            },
            spacing: {
              '4': '4px',
              '8': '8px',
              '12': '12px',
              '16': '16px',
              '24': '24px',
              '32': '32px',
              '48': '48px',
            },
            borderRadius: {
              'sm': '4px',
              'md': '8px',
              'lg': '12px',
            }
          }
        }
      }
    </script>

    <style>
      body {
        background-color: #000000;
        color: #c8c6bd;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      
      .app-background {
        position: fixed;
        inset: 0; 
        z-index: 0; 
        pointer-events: none; 
        user-select: none;
        background: radial-gradient(circle at 50% 50%, rgba(245,245,247,0.018), transparent 34%), #000000;
      }
      
      .app-grain {
        position: fixed; 
        inset: 0; 
        opacity: 0.12; 
        mix-blend-mode: soft-light;
        background-image: linear-gradient(rgba(245,245,247,0.014) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(245,245,247,0.014) 1px, transparent 1px);
        background-size: 4px 4px;
        -webkit-mask-image: radial-gradient(circle at center, black 0%, rgba(0,0,0,.85) 58%, transparent 100%);
        mask-image: radial-gradient(circle at center, black 0%, rgba(0,0,0,.85) 58%, transparent 100%);
        z-index: 0;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .app-grain {
          opacity: 0.05;
        }
      }

      .app-root {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #131210;
      }
      ::-webkit-scrollbar-thumb {
        background: #2c2a22;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9a988f;
      }
    </style>

      </head>
  <body>
    <div class="app-background"></div>
    <div class="app-grain"></div>
    <div id="root" class="app-root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
